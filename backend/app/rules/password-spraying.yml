id: password-spraying
title: One source tries many different accounts
description: Failed logins for eight or more distinct usernames from one source address within five minutes. Spraying stays under per-account lockout limits, so it is counted per source.
level: high
tags: [attack.credential_access, attack.t1110.003]
detection:
  failed_login:
    action: auth
    outcome: failure
  condition: failed_login
correlation:
  type: value_count
  value_field: user
  group_by: [src_ip]
  timespan: 5m
  threshold: 8
incident_type: password_spraying
