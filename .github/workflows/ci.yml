name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt -r sensors/requirements.txt
      - run: ruff check backend sensors simulator
        working-directory: .
      - name: Backend tests (rules, engine, API, anomaly model)
        run: python -m pytest --cov=app --cov-report=term-missing
        working-directory: backend
      - name: Sensor tests
        run: python -m pytest sensors/tests -q -p no:cacheprovider
      - name: Evaluation harness still runs
        run: python -m app.evaluate --seeds 1
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    # The real stack: PostgreSQL, API, both honeypots, dashboard and the simulator, then ask the API what it found.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for the simulator to finish
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Status}}' mini-soc-simulator-1)
            [ "$state" = "exited" ] && break
            sleep 5
          done
          docker compose logs simulator
          [ "$(docker inspect -f '{{.State.ExitCode}}' mini-soc-simulator-1)" = "0" ]
      - name: The dashboard's API shows alerts, incidents and honeypot contact
        run: |
          sleep 15  # the anomaly scorer ticks every 10 s
          auth="Authorization: Bearer demo-analyst-token-change-me"
          curl -sf -H "$auth" http://127.0.0.1:8080/api/stats | tee stats.json
          python3 - <<'EOF'
          import json
          stats = json.load(open("stats.json"))
          assert stats["alerts"] > 0 and stats["events"] > 1000, stats
          assert sum(stats["incidents"].values()) > 0, stats
          EOF
          curl -sf -H "$auth" http://127.0.0.1:8080/api/alerts?limit=200 | grep -q honeypot-ssh-contact
          curl -sf -H "$auth" http://127.0.0.1:8080/api/alerts?limit=200 | grep -q honeypot-web-contact
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/stats)" = "401"
      - if: failure()
        run: docker compose logs --tail=80
      - if: always()
        run: docker compose down -v
